{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post New Role | TalentOS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Exact same Dark Theme variables */
        :root {
            --bg-dark: #0f1528;
            --bg-sidebar: #131b31;
            --bg-card: #1b2541;
            --bg-hover: #233054;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-red: #f43f5e;
            --border-color: #2a365c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 1000;
        }
        .sidebar-brand { padding: 20px 24px; font-size: 1.25rem; font-weight: 700; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
        .brand-logo { color: var(--accent-red); font-size: 1.5rem; font-weight: 900; }
        .sidebar-menu { flex-grow: 1; padding: 20px 0; }
        .menu-section { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; padding: 0 24px; margin-bottom: 10px; margin-top: 20px; }
        .menu-item { padding: 10px 24px; display: block; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
        .menu-item:hover, .menu-item.active { color: var(--text-main); background-color: var(--bg-hover); border-left: 3px solid var(--accent-cyan); }

        /* --- MAIN CONTENT --- */
        .main-content { flex-grow: 1; margin-left: 260px; display: flex; flex-direction: column; min-height: 100vh; }
        .top-header { background-color: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
        .content-pad { padding: 40px; max-width: 900px; }

        /* --- CUSTOM FORM STYLING --- */
        .form-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .custom-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .custom-input {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        
        .custom-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }

        .btn-cyan { background-color: var(--accent-cyan); color: #000; font-weight: 700; border: none; border-radius: 6px; padding: 10px 24px; font-size: 0.9rem; transition: opacity 0.2s; }
        .btn-cyan:hover { background-color: #22d3ee; color: #000; }
        
        .btn-outline-dark { background-color: transparent; color: var(--text-muted); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 24px; font-size: 0.9rem; text-decoration: none; }
        .btn-outline-dark:hover { background-color: var(--bg-hover); color: var(--text-main); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand"><span class="brand-logo">N</span>TalentOS</div>
        <div class="sidebar-menu">
            <div class="menu-section">Management</div>
            <a href="{% url 'hr_dashboard' %}" class="menu-item">Master Dashboard</a>
            <div class="menu-section">System</div>
            <a href="#" class="menu-item active">Post New Role</a>
        </div>
    </aside>

    <main class="main-content">
        
        <header class="top-header">
            <div class="text-muted" style="font-size: 0.85rem;">
                <a href="{% url 'hr_dashboard' %}" style="color: var(--text-muted); text-decoration: none;">Dashboard</a> 
                <span class="mx-2">/</span> 
                <span style="color: var(--text-main);">Add New Role</span>
            </div>
            <a href="/logout/" class="btn-outline-dark text-decoration-none py-1 px-3">Sign Out</a>
        </header>

        <div class="content-pad">
            <div class="mb-4">
                <h3 style="font-weight: 700; margin-bottom: 5px;">Post New Role</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Create a new job listing for candidates to apply to.</p>
            </div>

            <div class="form-panel">
                <form method="POST" action="{% url 'add_job_posting' %}">
                    {% csrf_token %} <label class="custom-label">Position Title <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="custom-input" placeholder="e.g. Senior Machine Learning Engineer" required>

                    <label class="custom-label">Job Description</label>
                    <textarea name="description" class="custom-input" rows="4" placeholder="Brief overview of the role and company..."></textarea>

                    <label class="custom-label">Core Requirements (For AI Evaluation) <span class="text-danger">*</span></label>
                    <textarea name="core_requirements" class="custom-input" rows="6" placeholder="Paste the technical requirements here. The AI will use this exactly as written to grade incoming resumes..." required></textarea>

                    <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top" style="border-color: var(--border-color) !important;">
                        <a href="{% url 'hr_dashboard' %}" class="btn-outline-dark">Cancel</a>
                        <button type="submit" class="btn-cyan">Publish Role</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
